[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "within"
version = "0.1.0"
description = "One time budget for a whole call tree. Nested work can only shorten it."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "William Theesfeld", email = "william@theesfeld.net" }]
keywords = ["deadline", "timeout", "budget", "asyncio", "contextvars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/theesfeld/within"
Repository = "https://github.com/theesfeld/within"
Issues = "https://github.com/theesfeld/within/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/within"]

[tool.hatch.build.targets.wheel.sources]
"src/within" = "within"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
